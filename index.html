<!doctype html>
<html lang="ja">
<head>

  <title>切断最適化 | 材料ロス削減</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f2a33'/%3E%3Crect x='4' y='13' width='10' height='6' fill='%23e8590c'/%3E%3Crect x='16' y='13' width='7' height='6' fill='%23e8590c'/%3E%3Crect x='25' y='13' width='3' height='6' fill='%23889'/%3E%3C/svg%3E">
  <style>
:root {
  --bg: #f3f2ee;
  --surface: #ffffff;
  --ink: #1c2227;
  --muted: #646b72;
  --line: #d9d6ce;
  --line-soft: #ebe8e1;
  --bar: #1f2a33;
  --accent: #d9480f;
  --accent-ink: #ffffff;
  --accent-soft: #fff1e8;
  --steel: #46627c;
  --steel-soft: #dfe7ee;
  --ok: #2b7a3d;
  --ok-soft: #e4f3e7;
  --warn: #9a5b00;
  --warn-soft: #fff4dc;
  --err: #b42318;
  --err-soft: #fdecea;
  --rem: #b9b2a3;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(20, 24, 28, 0.06), 0 1px 1px rgba(20, 24, 28, 0.04);
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15191d;
    --surface: #1e2429;
    --ink: #e7e9eb;
    --muted: #9aa3ab;
    --line: #343c43;
    --line-soft: #2a3137;
    --bar: #0e1215;
    --accent: #f76707;
    --accent-soft: #3a2415;
    --steel: #7fa2c2;
    --steel-soft: #26333f;
    --ok: #69c47f;
    --ok-soft: #1c3323;
    --warn: #f0b44c;
    --warn-soft: #3a2f17;
    --err: #ff8a80;
    --err-soft: #3d1f1d;
    --rem: #6c665b;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
  font-variant-numeric: tabular-nums;
  padding-bottom: env(safe-area-inset-bottom);
}
a { color: var(--steel); }
h1, h2, h3 { line-height: 1.3; margin: 0 0 0.5em; }
h1 { font-size: 1.45rem; }
h2 { font-size: 1.1rem; }
h3 { font-size: 0.95rem; margin-top: 1.2em; color: var(--muted); font-weight: 600; letter-spacing: 0.04em; }
small, .small { font-size: 0.82rem; }
.muted { color: var(--muted); }
.warn { color: var(--warn); }
.err-t { color: var(--err); font-weight: 600; }
.na { color: var(--muted); }
.r { text-align: right; }
.unit { color: var(--muted); font-weight: 400; font-size: 0.85em; }

/* ---------- app bar */
.appbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 0 16px; padding-top: env(safe-area-inset-top);
  min-height: 52px;
  background: var(--bar); color: #fff;
}
.brand { color: #fff; text-decoration: none; font-weight: 700; display: flex; align-items: center; gap: 8px; letter-spacing: 0.04em; }
.logo { width: 22px; height: 10px; display: inline-block; background: linear-gradient(90deg, var(--accent) 0 44%, transparent 44% 50%, var(--accent) 50% 78%, transparent 78% 84%, #8a8f96 84%); border-radius: 2px; }
.appbar nav { display: flex; gap: 4px; }
.appbar nav a { color: #c9d1d8; text-decoration: none; padding: 14px 10px; font-size: 0.92rem; border-bottom: 3px solid transparent; }
.appbar nav a.active { color: #fff; border-bottom-color: var(--accent); }

.container { max-width: 980px; margin: 0 auto; padding: 16px 16px 120px; }

/* ---------- common blocks */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 14px; }
.page-head h1 { margin: 0; }
.back { text-decoration: none; font-weight: 600; padding: 6px 0; }
.section-h { font-size: 1rem; margin: 18px 0 8px; }
.section-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.small-h { font-size: 0.95rem; }
.grid-2 { display: grid; grid-template-columns: 1fr; gap: 0 14px; }
@media (min-width: 640px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
.empty { text-align: center; padding: 28px 16px; }
.danger-zone { margin-top: 28px; text-align: center; }

/* ---------- form */
.field { margin-bottom: 12px; min-width: 0; }
.field label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
input, select {
  width: 100%; font: inherit; font-size: 16px; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; min-height: 46px;
}
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
input[aria-invalid="true"] { border-color: var(--err); background: var(--err-soft); }
.field-error { color: var(--err); font-size: 0.82rem; margin-top: 4px; }
.input-title { font-size: 1.15rem; font-weight: 700; }
fieldset { border: 1px solid var(--line-soft); border-radius: 8px; padding: 12px; margin: 0 0 14px; }
legend { font-weight: 700; font-size: 0.9rem; padding: 0 6px; }
.check { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.check input { width: 22px; min-height: 22px; height: 22px; }
.form-errors ul { margin: 0 0 12px; padding: 10px 10px 10px 28px; background: var(--err-soft); color: var(--err); border-radius: 8px; }
.h-form { font-size: 1.2rem; }
.dims-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 0 10px; }

/* ---------- buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 8px 16px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--err); }
.btn.small { min-height: 36px; padding: 4px 12px; font-size: 0.88rem; }
.btn.block { width: 100%; }
.btn.lg { min-height: 54px; font-size: 1.05rem; }
.actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 8px; }
.actions.left { justify-content: flex-start; }
.icon-btn {
  min-height: 40px; min-width: 52px; padding: 4px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-size: 0.85rem; cursor: pointer;
}
.icon-btn.danger { color: var(--err); }

/* ---------- home */
.project-list { list-style: none; margin: 0; padding: 0; }
.project-item { display: grid; gap: 2px; text-decoration: none; color: inherit; }
.project-item:hover { border-color: var(--steel); }
.pi-name { font-weight: 700; font-size: 1.05rem; }
.pi-client { color: var(--muted); font-size: 0.9rem; }
.pi-meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 0.82rem; }
.new-form .actions { margin-top: 0; }

/* ---------- project */
.add-card h2 { margin-bottom: 10px; }
.add-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.f-len input { font-size: 1.2rem; font-weight: 700; }
.stepper { display: grid; grid-template-columns: 46px 1fr 46px; }
.stepper input { border-radius: 0; text-align: center; font-size: 1.2rem; font-weight: 700; border-left: 0; border-right: 0; padding: 10px 4px; }
.step { border: 1px solid var(--line); background: var(--line-soft); font-size: 1.3rem; color: var(--ink); cursor: pointer; }
.step:first-child { border-radius: 8px 0 0 8px; }
.step:last-child { border-radius: 0 8px 8px 0; }
.line-group { padding: 12px 12px 4px; }
.lg-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.lg-sum { color: var(--muted); font-size: 0.88rem; }
.type-tag { display: inline-block; font-size: 0.72rem; font-weight: 700; color: var(--steel); background: var(--steel-soft); border-radius: 4px; padding: 1px 6px; margin-right: 6px; vertical-align: 2px; }
.lines { list-style: none; margin: 0; padding: 0; }
.line {
  display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 4px 12px;
  padding: 8px 0; border-top: 1px solid var(--line-soft);
}
.l-len { font-size: 1.15rem; font-weight: 700; }
.l-len small, .l-qty small { font-size: 0.75rem; color: var(--muted); margin-left: 2px; font-weight: 400; }
.l-qty { font-weight: 600; }
.l-label { color: var(--muted); font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.l-act { display: flex; gap: 6px; }
.line.editing { display: block; background: var(--accent-soft); margin: 0 -12px; padding: 12px; }
@media (max-width: 420px) {
  .line { grid-template-columns: auto 1fr auto; }
  .l-label { grid-column: 1 / -1; grid-row: 2; }
  .l-label:empty { display: none; }
  .l-act { grid-row: 1; grid-column: 3; }
}
.conditions summary { font-weight: 700; cursor: pointer; padding: 4px 0; }
.conditions[open] summary { margin-bottom: 8px; }
.src { display: inline-block; margin-left: 6px; font-size: 0.72rem; color: var(--muted); }
.sticky-cta {
  position: sticky; bottom: 0; z-index: 10; margin: 18px -16px 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}

/* ---------- tables */
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; }
.table th, .table td { padding: 8px 6px; border-bottom: 1px solid var(--line-soft); text-align: left; vertical-align: top; }
.table th { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
.table th.r, .table td.r { text-align: right; white-space: nowrap; }
.table tfoot th { color: var(--ink); font-size: 0.95rem; border-bottom: 0; }

/* ---------- master */
.mat-list { list-style: none; margin: 0; padding: 0; }
.mat-list a { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 10px 0; border-top: 1px solid var(--line-soft); color: inherit; text-decoration: none; }
.mat-list a:hover .m-spec { color: var(--accent); }
.m-spec { font-weight: 700; }
.m-stock { color: var(--muted); }
.mat-group .lg-head { align-items: center; }
.stock-list { list-style: none; padding: 0; margin: 0 0 8px; }
.stock-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 0 10px; align-items: end; }
.stock-row.sheet { grid-template-columns: 1fr 1fr 1fr auto; }
.stock-row .icon-btn { margin-bottom: 15px; min-height: 46px; }
@media (max-width: 480px) {
  .stock-row.sheet { grid-template-columns: 1fr 1fr; }
  .stock-row.sheet .icon-btn { grid-column: 2; justify-self: end; }
}

/* ---------- result */
.result-head h1 { margin: 0 0 2px; }
.result-head p { margin: 0; }
.result-head { margin-bottom: 14px; }
.legend-row { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.85rem; margin-bottom: 6px; }
.sw { display: inline-block; width: 18px; height: 12px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.sw.piece { background: var(--steel); }
.sw.cut { background: var(--accent); width: 4px; }
.sw.trim { background: repeating-linear-gradient(-45deg, var(--muted) 0 2px, transparent 2px 4px); border: 1px solid var(--muted); }
.sw.rem { background: repeating-linear-gradient(45deg, var(--rem) 0 3px, transparent 3px 6px); border: 1px solid var(--rem); }
.job-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; align-items: flex-start; }
.job-head h2 { margin: 2px 0 0; font-size: 1.2rem; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { display: inline-block; font-size: 0.78rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.err { background: var(--err-soft); color: var(--err); }
.errors { color: var(--err); background: var(--err-soft); border-radius: 8px; padding: 10px 10px 10px 28px; margin: 10px 0; }
.cond-line { font-size: 0.85rem; color: var(--muted); background: var(--line-soft); border-radius: 6px; padding: 8px 10px; margin: 10px 0; }
.cond-line b { color: var(--ink); }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 12px 0 4px; }
@media (min-width: 720px) { .stats { grid-template-columns: repeat(4, 1fr); } }
.stat { border: 1px solid var(--line-soft); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; min-width: 0; }
.stat .k { font-size: 0.76rem; color: var(--muted); font-weight: 600; }
.stat .v { font-size: 1.15rem; font-weight: 700; line-height: 1.35; }
.stat .v small { font-size: 0.72rem; color: var(--muted); font-weight: 500; margin: 0 1px; }
.stat .sub { font-size: 0.74rem; color: var(--muted); }
.stat.main { grid-column: 1 / -1; background: var(--accent-soft); border-color: transparent; }
.stat.main .v b { color: var(--accent); font-size: 1.4rem; }
@media (min-width: 720px) { .stat.main { grid-column: span 2; grid-row: span 2; justify-content: center; } }

.patterns { list-style: none; margin: 0; padding: 0; }
.pattern { border-top: 1px solid var(--line-soft); padding: 12px 0; break-inside: avoid; }
.p-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-bottom: 8px; }
.p-name { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 6px; background: var(--bar); color: #fff; font-weight: 700; }
.rep { color: var(--accent); font-size: 1.1rem; }
.bar { display: flex; height: 34px; border: 1px solid var(--ink); border-radius: 3px; overflow: hidden; background: var(--surface); }
.seg { flex: 0 0 auto; min-width: 0; height: 100%; position: relative; display: grid; place-items: center; overflow: hidden; }
.seg.piece { background: var(--steel); color: #fff; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15); }
.seg.cut { flex: 0 0 3px; background: var(--accent); }
.seg.trim { background: repeating-linear-gradient(-45deg, var(--muted) 0 2px, transparent 2px 4px); }
.seg.rem { flex-grow: 1; background: repeating-linear-gradient(45deg, var(--rem) 0 3px, transparent 3px 6px); color: var(--ink); }
.seg-t { font-size: 0.72rem; font-weight: 700; white-space: nowrap; }
.seg-t.hide { visibility: hidden; }
.table .mat-row td { font-weight: 700; padding-top: 12px; border-bottom: 0; }
.table .mat-row + tr td { padding-top: 2px; }
.seg.rem .seg-t { background: var(--surface); padding: 0 3px; border-radius: 3px; }
.chips { list-style: none; margin: 8px 0 4px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.chips li { background: var(--steel-soft); border-radius: 6px; padding: 3px 8px; font-size: 0.88rem; }
.chips .lbl { color: var(--steel); font-weight: 700; }
.p-foot { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8rem; color: var(--muted); }
.rem-t b { color: var(--ink); }
.skipped .warn { margin: 0 0 4px; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; margin-right: 8px; vertical-align: -2px; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- toast */
.toast {
  position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
  background: var(--bar); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 0.92rem;
  opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 50; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.error { background: var(--err); }

/* ---------- print */
@media print {
  :root { --bg: #fff; --surface: #fff; --ink: #000; --muted: #444; --line: #999; --line-soft: #ccc; }
  body { font-size: 11pt; }
  .appbar, .no-print, .sticky-cta, .danger-zone, .legend { display: none !important; }
  .container { padding: 0; max-width: none; }
  .card { box-shadow: none; border: 0; padding: 0; margin-bottom: 14pt; }
  .job { break-before: auto; }
  .stat.main, .cond-line { background: none; border: 1px solid #999; }
  .seg.piece { background: #888 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .seg.cut { background: #000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .seg, .sw, .badge, .p-name { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  a { color: inherit; text-decoration: none; }
}

</style>

  <script>globalThis.__STEELCUT_WORKER_SRC__ = "// ---- js/core/cutting1d.js\nconst __m0 = (() => {\n// 一次元切断最適化（角パイプ・丸パイプ・アングル・チャンネル・フラットバー・丸棒）\n// DOM非依存。ブラウザ・Web Worker・Node.js のいずれからも import できる。\n//\n// ■ 切断モデル（すべて整数mm）\n//   定尺 L から部材 l1..ln を切り出すとき、\n//   ・端部切り落とし trim > 0 の場合：先端で trim を落とし、その切断で切断幅 kerf を1回消費\n//   ・部材と部材の間：切断幅 kerf を1回ずつ消費（n-1回）\n//   ・最後の部材のあと残り rest が\n//       rest = 0        … 切断不要（ちょうど使い切り）\n//       0 < rest ≦ kerf … その全量を切断ロスとする（残材なし）\n//       rest > kerf     … 1回切断して kerf を消費、残り rest-kerf を残材とする\n//   収まる条件：(trim>0 ? trim+kerf : 0) + Σl + (n-1)·kerf ≦ L\n//   検算式：Σl + 切断幅ロス + 端部切り落とし + 残材 = L\n//\n// ■ 最適化の評価順（辞書式）\n//   ① 定尺本数　② 購入費用（全定尺に単価がある場合）／購入長さ（単価未登録がある場合）\n//   ③ 端材＋切断ロスの合計（= 購入長さ − 部材合計）\n\nconst DEFAULT_LIMITS = Object.freeze({\n  maxStates: 250_000, // 厳密探索で記憶する状態数の上限\n  maxNodes: 6_000_000, // 切断パターン列挙の上限\n  timeLimitMs: 4000, // 厳密探索の時間上限\n  restarts: 80, // ヒューリスティックの乱択試行回数\n});\n\nclass InputError extends Error {\n  constructor(errors) {\n    super(errors.join('\\n'));\n    this.errors = errors;\n  }\n}\n\nconst sum = (a) => a.reduce((s, v) => s + v, 0);\n\n/** 先端の切り落としで失う長さ（切断幅込み） */\nfunction headLoss(kerf, trim) {\n  return trim > 0 ? trim + kerf : 0;\n}\n\n/**\n * 1本の定尺から部材を切り出したときの内訳を計算する。\n * @param {number} stockLength 定尺長さ\n * @param {number[]} pieceLengths 部材長さ\n */\nfunction layoutBar(stockLength, pieceLengths, kerf, trim) {\n  const n = pieceLengths.length;\n  const pieceSum = sum(pieceLengths);\n  const head = headLoss(kerf, trim);\n  const used = head + pieceSum + (n > 0 ? (n - 1) * kerf : 0);\n  const rest = stockLength - used;\n  if (rest < 0) return { fits: false, stockLength, pieceSum, pieceCount: n, overBy: -rest };\n  let tailCut = 0;\n  let sliver = 0;\n  let remnant = 0;\n  if (rest > kerf) {\n    tailCut = kerf;\n    remnant = rest - kerf;\n  } else if (rest > 0) {\n    sliver = rest;\n  }\n  const cutCount = (trim > 0 ? 1 : 0) + Math.max(0, n - 1) + (rest > 0 ? 1 : 0);\n  const kerfLoss = (tri function makeCtx(norm) {
  const { kerf, trim, stocks, types, costBasis } = norm;
  const w = types.map((t) => t.length + kerf); // 部材1本が消費する長さ（切断幅込み）
  const cap = stocks.map((s) => s.length - headLoss(kerf, trim) + kerf); // 定尺の容量
  const stockCost = stocks.map((s) => (costBasis === 'price' ? s.price : s.length));
  return { ...norm, w, cap, stockCost };
}

/** 本数の下限（Martello–Toth L2 を最長定尺の容量で適用） */
function lowerBoundBars(ctx) {
  const C = Math.max(...ctx.cap);
  const items = [];
  ctx.types.forEach((t, i) => {
    for (let k = 0; k < t.demand; k++) items.push(ctx.w[i]);
  });
  const total = sum(items);
  let best = Math.ceil(total / C);
  const ks = [...new Set(items.filter((x) => x <= C / 2))];
  ks.push(0);
  for (const k of ks) {
    let n1 = 0;
    let n2 = 0;
    let s2 = 0;
    let s3 = 0;
    for (const x of items) {
      if (x > C - k) n1++;
      else if (x > C / 2) {
        n2++;
        s2 += x;
      } else if (x >= k) s3 += x;
    }
    const lb = n1 + n2 + Math.max(0, Math.ceil((s3 - (n2 * C - s2)) / C));
    if (lb > best) best = lb;
  }
  return best;
}

// ---------------------------------------------------------------------------
// 厳密解：残り需要ベクトルを状態とする記憶化探索
//   ・各定尺は「残っている最長の部材を必ず含む」
//   ・その定尺に対して極大（残りのどの部材ももう入らない）なパターンのみ列挙
//   この2つの制約の下でも最適解が必ず存在する（部材の入れ替え・後ろの定尺からの移動で示せる）。
// ---------------------------------------------------------------------------
const ABORT = Symbol('abort');

function solveExact(ctx, limits) {
  const T = ctx.types.length;
  const S = ctx.stocks.length;
  const memo = new Map();
  const deadline = Date.now() + limits.timeLimitMs;
  let nodes = 0;
  const ZERO = { bars: 0, cost: 0, waste: 0 };

  function patterns(state, f, s) {
    const out = [];
    const x = new Array(T).fill(0);
    const C = ctx.cap[s];
    function dfs(i, rem) {
      if (++nodes > limits.maxNodes) throw ABORT;
      if ((nodes & 0x3fff) === 0 && Date.now() > deadline) throw ABORT;
      if (i === T) {
        // 極大性：残りの部材でまだ入るものがあれば不採用
        for (let j = T - 1; j >= f; j--) {
          if (state[j] - x[j] > 0) {
            if (ctx.w[j] <= rem) return;
            break; // w は降順なので最小のものだけ見ればよい
          }
        }
        out.push(x.slice());
        return;
      }
      if (i < f) return dfs(f, rem);
      const maxK = Math.min(state[i], Math.floor(rem / ctx.w[i]));
      const minK = i === f ? 1 : 0;
      for (let k = maxK; k >= minK; k--) {
        x[i] = k;
        dfs(i + 1, rem - k * ctx.w[i]);
      }
      x[i] = 0;
    }
    if (ctx.w[f] <= C) dfs(f, C);
    return out;
  }

  function rec(state) {
    let f = -1;
    for (let i = 0; i < T; i++) {
      if (state[i] > 0) {
        f = i;
        break;
      }
    }
    if (f < 0) return ZERO;
    const key = state.join(',');
    const hit = memo.get(key);
    if (hit) return hit;
    if (memo.size >= limits.maxStates) throw ABORT;
    let best = null;
    for (let s = 0; s < S; s++) {
      for (const x of patterns(state, f, s)) {
        const child = state.map((v, i) => v - x[i]);
        const r = rec(child);
        let pieceSum = 0;
        for (let i = 0; i < T; i++) pieceSum += x[i] * ctx.types[i].length;
        const cand = {
          bars: r.bars + 1,
          cost: r.cost + ctx.stockCost[s],
          waste: r.waste + ctx.stocks[s].length - pieceSum,
          s,
          x,
          child,
        };
        if (better(cand, best)) best = cand;
      }
    }
    memo.set(key, best);
    return best;
  }

  try {
    let state = ctx.types.map((t) => t.demand);
    const root = rec(state);
    const bars = [];
    let node = root;
    while (node && node.x) {
      bars.push({ s: node.s, counts: node.x });
      state = node.child;
      node = rec(state);
    }
    return { bars, states: memo.size, nodes };
  } catch (e) {
    if (e === ABORT) return null;
    throw e;
  }
}

// ---------------------------------------------------------------------------
// ヒューリスティック（大規模入力用・初期解）
// ---------------------------------------------------------------------------

/** 有界ナップサック：容量 C に詰める部材本数ベクトル（消費長さ最大） */
function bestFill(ctx, remaining, C) {
  const items = []; // {type, k, weight}
  ctx.types.forEach((t, i) => {
    let left = Math.min(remaining[i], Math.floor(C / ctx.w[i]));
    let k = 1;
    while (left > 0) {
      const take = Math.min(k, left);
      items.push({ type: i, k: take, weight: take * ctx.w[i] });
      left -= take;
      k *= 2;
    }
  });
  const from = new Int32Array(C + 1).fill(-1); // その容量に初めて到達した品目
  const reach = new Uint8Array(C + 1);
  reach[0] = 1;
  for (let it = 0; it < items.length; it++) {
    const wt = items[it].weight;
    for (let c = C; c >= wt; c--) {
      if (!reach[c] && reach[c - wt]) {
        reach[c] = 1;
        from[c] = it;
      }
    }
  }
  let c = C;
  while (c > 0 && !reach[c]) c--;
  const x = new Array(ctx.types.length).fill(0);
  while (c > 0) {
    const it = items[from[c]];
    x[it.type] += it.k;
    c -= it.weight;
  }
  return x;
}

function pieceSumOf(ctx, counts) {
  let s = 0;
  for (let i = 0; i < counts.length; i++) s += counts[i] * ctx.types[i].length;
  return s;
}
function usedOf(ctx, counts) {
  let s = 0;
  for (let i = 0; i < counts.length; i++) s += counts[i] * ctx.w[i];
  return s;
}

/** 各定尺の内容を収められる最も安い（同額なら短い）定尺に置き換える */
function downsize(ctx, bars) {
  return bars.map((b) => {
    const used = usedOf(ctx, b.counts);
    let bestS = b.s;
    for (let s = 0; s < ctx.stocks.length; s++) {
      if (ctx.cap[s] < used) continue;
      const cs = ctx.stockCost[s];
      const cb = ctx.stockCost[bestS];
      if (ctx.cap[bestS] < used || cs < cb || (cs === cb && ctx.stocks[s].length < ctx.stocks[bestS].length)) bestS = s;
    }
    return { s: bestS, counts: b.counts };
  });
}

function scoreBars(ctx, bars) {
  let cost = 0;
  let waste = 0;
  for (const b of bars) {
    cost += ctx.stockCost[b.s];
    waste += ctx.stocks[b.s].length - pieceSumOf(ctx, b.counts);
  }
  return { bars: bars.length, cost, waste };
}

function sequentialKnapsack(ctx, stockChooser) {
  const remaining = ctx.types.map((t) => t.demand);
  const bars = [];
  while (remaining.some((v) => v > 0)) {
    let pick = null;
    for (const s of stockChooser) {
      const x = bestFill(ctx, remaining, ctx.cap[s]);
      if (x.every((v) => v === 0)) continue;
      const ps = pieceSumOf(ctx, x);
      const ratio = ps / ctx.stocks[s].length;
      if (!pick || ratio > pick.ratio) pick = { s, x, ratio };
    }
    if (!pick) throw new Error('internal: no pattern fits');
    bars.push({ s: pick.s, counts: pick.x });
    pick.x.forEach((v, i) => (remaining[i] -= v));
  }
  return bars;
}

/** 並び順を与えた First/Best Fit Decreasing（最長定尺を使用） */
function fitDecreasing(ctx, order, best) {
  const C = Math.max(...ctx.cap);
  const sMax = ctx.cap.indexOf(C);
  const bins = []; // {free, counts}
  for (const i of order) {
    const wi = ctx.w[i];
    let target = null;
    for (const b of bins) {
      if (b.free >= wi && (!target || (best ? b.free < target.free : false))) {
        target = b;
        if (!best) break;
      }
    }
    if (!target) {
      target = { free: C, counts: new Array(ctx.types.length).fill(0) };
      bins.push(target);
    }
    target.free -= wi;
    target.counts[i]++;
  }
  return bins.map((b) => ({ s: sMax, counts: b.counts }));
}

/** 最も詰まりの悪い定尺を他の定尺の空きへ分配して1本減らせないか試す */
function tryEliminate(ctx, bars) {
  const C = Math.max(...ctx.cap);
  const sMax = ctx.cap.indexOf(C);
  let cur = bars.map((b) => ({ s: sMax, counts: b.counts.slice() }));
  let improved = true;
  while (improved && cur.length > 1) {
    improved = false;
    const order = cur.map((b, i) => [usedOf(ctx, b.counts), i]).sort((a, b) => a[0] - b[0]);
    for (const [, vi] of order) {
      const victim = cur[vi];
      const others = cur.filter((_, i) => i !== vi).map((b) => ({ s: b.s, counts: b.counts.slice(), free: C - usedOf(ctx, b.counts) }));
      let ok = true;
      for (let t = 0; t < victim.counts.length && ok; t++) {
        for (let k = 0; k < victim.counts[t]; k++) {
          let tgt = null;
          for (const o of others) if (o.free >= ctx.w[t] && (!tgt || o.free < tgt.free)) tgt = o;
          if (!tgt) {
            ok = false;
            break;
          }
          tgt.free -= ctx.w[t];
          tgt.counts[t]++;
        }
      }
      if (ok) {
        cur = others.map((o) => ({ s: o.s, counts: o.counts }));
        improved = true;
        break;
      }
    }
  }
  return cur;
}

function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function solveHeuristic(ctx, limits) {
  const candidates = [];
  const allS = ctx.stocks.map((_, s) => s);
  const longest = [ctx.cap.indexOf(Math.max(...ctx.cap))];
  candidates.push(sequentialKnapsack(ctx, longest));
  candidates.push(sequentialKnapsack(ctx, allS));
  const base = [];
  ctx.types.forEach((t, i) => {
    for (let k = 0; k < t.demand; k++) base.push(i);
  });
  candidates.push(fitDecreasing(ctx, base, false));
  candidates.push(fitDecreasing(ctx, base, true));
  const rnd = mulberry32(12345);
  for (let r = 0; r < limits.restarts; r++) {
    const order = base.slice();
    // 降順を保ちつつ近傍をランダムに入れ替える
    for (let i = 0; i < order.length - 1; i++) {
      if (rnd() < 0.3) {
        const j = Math.min(order.length - 1, i + 1 + Math.floor(rnd() * 3));
        [order[i], order[j]] = [order[j], order[i]];
      }
    }
    candidates.push(fitDecreasing(ctx, order, rnd() < 0.5));
  }
  let best = null;
  let bestScore = null;
  for (const c of candidates) {
    for (const variant of [c, tryEliminate(ctx, c)]) {
      const d = downsize(ctx, variant);
      const sc = scoreBars(ctx, d);
      if (better(sc, bestScore)) {
        best = d;
        bestScore = sc;
      }
    }
  }
  return best;
}

// ---------------------------------------------------------------------------
// 本数のみの厳密探索（厳密解が上限に達した大規模入力用）
//   「B本で切り出せるか」を、面積下限による枝刈りと失敗状態の記憶で判定する。
// ---------------------------------------------------------------------------
function searchBarCount(ctx, lowerBound, upperBound, limits) {
  const T = ctx.types.length;
  const C = Math.max(...ctx.cap);
  const sMax = ctx.cap.indexOf(C);
  const deadline = Date.now() + limits.timeLimitMs;
  const failed = new Map(); // state -> この本数以下では不可能と判明した最大本数
  let nodes = 0;

  function feasible(state, remW, k, out) {
    if (remW === 0) return true;
    if (k === 0 || Math.ceil(remW / C) > k) return false;
    if (++nodes > limits.maxNodes || ((nodes & 0x3ff) === 0 && Date.now() > deadline)) throw ABORT;
    const key = state.join(',');
    if ((failed.get(key) ?? -1) >= k) return false;
    let f = 0;
    while (state[f] === 0) f++;
    // 極大パターンを詰まりの良い順に列挙
    const pats = [];
    const x = new Array(T).fill(0);
    (function dfs(i, rem) {
      if (i === T) {
        for (let j = T - 1; j >= f; j--) {
          if (state[j] - x[j] > 0) {
            if (ctx.w[j] <= rem) return;
            break;
          }
        }
        pats.push({ x: x.slice(), used: C - rem });
        return;
      }
      const maxK = Math.min(state[i], Math.floor(rem / ctx.w[i]));
      for (let c = maxK; c >= (i === f ? 1 : 0); c--) {
        x[i] = c;
        dfs(i + 1, rem - c * ctx.w[i]);
      }
      x[i] = 0;
    })(f, C);
    pats.sort((a, b) => b.used - a.used);
    for (const p of pats) {
      const child = state.map((v, i) => v - p.x[i]);
      out.push(p.x);
      if (feasible(child, remW - p.used, k - 1, out)) return true;
      out.pop();
    }
    failed.set(key, Math.max(failed.get(key) ?? -1, k));
    return false;
  }

  const state = ctx.types.map((t) => t.demand);
  const remW = state.reduce((a, v, i) => a + v * ctx.w[i], 0);
  try {
    for (let B = lowerBound; B < upperBound; B++) {
      const out = [];
      if (feasible(state, remW, B, out)) return { bars: out.map((x) => ({ s: sMax, counts: x })), barsProven: true };
    }
    return { bars: null, barsProven: true }; // 上界（ヒューリスティック解）が最小本数
  } catch (e) {
    if (e === ABORT) return { bars: null, barsProven: false };
    throw e;
  }
}

// ---------------------------------------------------------------------------
// 結果の組み立て
// ---------------------------------------------------------------------------
function buildResult(ctx, rawBars, meta) {
  // 同一寸法の部材に符号（ラベル）を順番に割り当てる
  const labelQueues = ctx.types.map((t) => {
    const q = [];
    for (const l of t.labels) for (let k = 0; k < l.qty; k++) q.push(l.label);
    return q;
  });
  const ordered = rawBars
    .map((b) => ({ ...b, used: usedOf(ctx, b.counts) }))
    .sort((a, b) => {
      const d = ctx.stocks[b.s].length - ctx.stocks[a.s].length || b.used - a.used;
      if (d) return d;
      const ka = a.counts.join(',');
      const kb = b.counts.join(',');
      return ka < kb ? 1 : ka > kb ? -1 : 0;
    });

  const bars = ordered.map((b, idx) => {
    const pieces = [];
    b.counts.forEach((cnt, i) => {
      for (let k = 0; k < cnt; k++) pieces.push({ length: ctx.types[i].length, label: labelQueues[i].shift() ?? '' });
    });
    const stock = ctx.stocks[b.s];
    const lay = layoutBar(stock.length, pieces.map((p) => p.length), ctx.kerf, ctx.trim);
    return { no: idx + 1, stockLength: stock.length, price: stock.price, pieces, ...lay };
  });

  // 同一パターンをまとめる
  const patMap = new Map();
  for (const b of bars) {
    const key = `${b.stockLength}|${b.pieces.map((p) => `${p.length}:${p.label}`).join(',')}`;
    if (!patMap.has(key)) {
      const groups = [];
      for (const p of b.pieces) {
        const g = groups.find((x) => x.length === p.length && x.label === p.label);
        if (g) g.count++;
        else groups.push({ length: p.length, label: p.label, count: 1 });
      }
      patMap.set(key, {
        stockLength: b.stockLength,
        price: b.price,
        pieces: groups,
        pieceSum: b.pieceSum,
        pieceCount: b.pieceCount,
        cutCount: b.cutCount,
        kerfLoss: b.kerfLoss,
        trimLoss: b.trimLoss,
        remnant: b.remnant,
        repeat: 0,
        barNos: [],
      });
    }
    const p = patMap.get(key);
    p.repeat++;
    p.barNos.push(b.no);
  }
  const patterns = [...patMap.values()];

  const byStock = ctx.stocks
    .map((s) => {
      const count = bars.filter((b) => b.stockLength === s.length).length;
      return { length: s.length, price: s.price, count, subtotal: s.price == null ? null : s.price * count };
    })
    .filter((x) => x.count > 0);
  const purchasedLength = sum(bars.map((b) => b.stockLength));
  const pieceLength = sum(bars.map((b) => b.pieceSum));
  const kerfLoss = sum(bars.map((b) => b.kerfLoss));
  const trimLoss = sum(bars.map((b) => b.trimLoss));
  const remnant = sum(bars.map((b) => b.remnant));
  const materialCost = byStock.every((x) => x.price != null) ? sum(byStock.map((x) => x.subtotal)) : null;

  return {
    ok: true,
    conditions: { kerf: ctx.kerf, trim: ctx.trim, headLoss: headLoss(ctx.kerf, ctx.trim), stocks: ctx.stocks, costBasis: ctx.costBasis },
    bars,
    patterns,
    summary: {
      barCount: bars.length,
      byStock,
      materialCost, // 単価未登録の定尺を使う場合は null（金額を推定しない）
      purchasedLength,
      pieceLength,
      pieceCount: sum(bars.map((b) => b.pieceCount)),
      cutCount: sum(bars.map((b) => b.cutCount)),
      kerfLoss,
      trimLoss,
      remnant,
      yieldRate: purchasedLength ? pieceLength / purchasedLength : 0, // 歩留まり
    },
    ...meta,
  };
}

/**
 * 一次元切断最適化
 * @param {{pieces:{length:number,qty:number,label?:string}[], stocks:{length:number,price?:number|null}[], kerf:number, trim:number}} input
 * @param {Partial<typeof DEFAULT_LIMITS>} [limits]
 */
function optimize1D(input, limits = {}) {
  const lim = { ...DEFAULT_LIMITS, ...limits };
  let norm;
  try {
    norm = normalizeInput(input);
  } catch (e) {
    if (e instanceof InputError) return { ok: false, errors: e.errors };
    throw e;
  }
  const ctx = makeCtx(norm);
  const t0 = Date.now();
  const lowerBound = lowerBoundBars(ctx);
  const heur = solveHeuristic(ctx, lim);
  const heurScore = scoreBars(ctx, heur);

  // 単一定尺で本数が下限に一致すれば、費用・ロスも一意に決まるため最適
  if (ctx.stocks.length === 1 && heurScore.bars === lowerBound) {
    return buildResult(ctx, heur, { optimality: 'proven', method: 'heuristic+bound', lowerBound, elapsedMs: Date.now() - t0 });
  }
  const exact = solveExact(ctx, lim);
  if (exact) {
    const exScore = scoreBars(ctx, exact.bars);
    // 理論上 exact は heur 以上に良い。念のため良い方を採用する
    const useExact = !better(heurScore, exScore);
    return buildResult(ctx, useExact ? exact.bars : heur, {
      optimality: 'proven',
      method: 'exact',
      lowerBound,
      states: exact.states,
      elapsedMs: Date.now() - t0,
    });
  }
  let bars = heur;
  let barsProven = heurScore.bars === lowerBound;
  if (!barsProven) {
    const sb = searchBarCount(ctx, lowerBound, heurScore.bars, lim);
    barsProven = sb.barsProven;
    if (sb.bars) bars = downsize(ctx, sb.bars);
  }
  const finalBars = scoreBars(ctx, bars).bars;
  // 単一定尺なら本数が最適＝費用・ロスも最適
  const optimality = barsProven ? (ctx.stocks.length === 1 ? 'proven' : 'bars-proven') : 'unproven';
  return buildResult(ctx, bars, {
    optimality,
    method: 'heuristic',
    lowerBound: barsProven ? finalBars : lowerBound,
    elapsedMs: Date.now() - t0,
  });
}

return { DEFAULT_LIMITS, InputError, headLoss, layoutBar, normalizeInput, lowerBoundBars, optimize1D };
})();
